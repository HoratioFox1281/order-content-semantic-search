[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "order-content-semantic-search"
version = "0.1.0"
description = "Semantic search service for checkout, fulfillment, receipts, and order updates"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.50,<2",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/order_content_search"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
